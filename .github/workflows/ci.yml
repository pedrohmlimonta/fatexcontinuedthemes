name: CI

# Conferência rápida a cada push/pull request: manifesto, sintaxe dos scripts, idiomas e imagens usadas pelo CSS.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Conferir o módulo
        run: node .github/scripts/check.mjs
